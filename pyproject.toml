[project]
name = "incidentops"
version = "0.1.0"
description = "Minimal Kafka order processing pipeline for IncidentOps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.12,<3",
    "elasticsearch>=8.19,<9",
    "langchain-core==1.4.9",
    "langchain-openai==1.3.5",
    "langgraph==1.2.9",
    "prometheus-client==0.25.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
incidentops-producer = "incidentops.producer:main"
incidentops-consumer = "incidentops.consumer:main"
incidentops-log-search = "incidentops.log_search:main"
incidentops-metric-query = "incidentops.metric_query:main"

[dependency-groups]
dev = [
    "pyright>=1.1.405,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentops"]

[tool.pytest.ini_options]
addopts = "-ra --capture=sys"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
