groups:
  - name: incidentops-development-recording-rules
    interval: 2s
    rules:
      - record: incidentops:orders_produced:rate30s
        expr: rate(incidentops_orders_produced_total[30s])
      - record: incidentops:orders_processed:rate30s
        expr: rate(incidentops_orders_processed_total[30s])
      - record: incidentops:order_processing_duration:p95_30s
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (
              rate(incidentops_order_processing_duration_seconds_bucket[30s])
            )
          )
