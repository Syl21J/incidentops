global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: incidentops-producer
    static_configs:
      - targets:
          - host.docker.internal:8001

  - job_name: incidentops-consumer
    static_configs:
      - targets:
          - host.docker.internal:8002
