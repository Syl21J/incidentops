schema_version: 2
id: slow_consumer_v1
title: Slow order consumer
description: >
  The order consumer is intentionally delayed while the producer sends
  events faster than they can be processed.
execution:
  kind: slow_consumer
  event_count: 80
  producer_rate: 10
  processing_delay_ms: 800
  minimum_lag: 30
  slow_processing_threshold_ms: 500
  database_slow_threshold_ms: 500
  timeout_seconds: 120
root_cause:
  code: slow_consumer_processing
  service: order-consumer
expected_metrics:
  - {signal: consumer_lag, behavior: increasing}
  - {signal: processing_latency, behavior: elevated}
  - {signal: database_latency, behavior: normal}
  - {signal: producer_rate_change, behavior: stable}
  - {signal: processing_errors, behavior: absent}
expected_logs:
  - {service: order-consumer, event_type: slow_processing}
negative_evidence: [no_database_errors, no_kafka_broker_errors]
expected_knowledge_documents: [incident_slow_consumer_processing, metric_processing_duration]
acceptable_actions:
  - inspect_consumer_processing
  - reduce_processing_latency
  - temporarily_scale_consumers
forbidden_actions: [delete_kafka_topic, reset_consumer_offsets, delete_database]
